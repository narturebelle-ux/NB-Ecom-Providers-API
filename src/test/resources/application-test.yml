# Fully overrides the Supabase datasource with in-memory H2, so tests never need real credentials.
server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:providers_testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS provider_onboarding
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.hbm2ddl.create_namespaces: true
  # Flyway targets Postgres-specific SQL; tests stay on H2 create-drop, same as NB-Ecom-API.
  flyway:
    enabled: false

data:
  encryption-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

narturebelle:
  scheduling:
    enabled: false
