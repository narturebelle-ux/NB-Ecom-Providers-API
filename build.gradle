plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.narturebelle'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Same as NB-Ecom-API: Byte Buddy's agent is loaded on the test JVM, because Mockito's self-attach
// can fail on Windows with "Could not self-attach" when memory is tight.
configurations {
    mockitoAgent
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Firebase Admin SDK for token verification (same Firebase project as NB-Ecom-API)
    implementation 'com.google.firebase:firebase-admin:9.4.3'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Flyway manages this service's own schema only; NB-Ecom-API keeps managing public.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Postgres Database (the same Supabase database as NB-Ecom-API)
    runtimeOnly 'org.postgresql:postgresql'

    // Testing (H2 is test-only)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    mockitoAgent('net.bytebuddy:byte-buddy-agent') { transitive = false }
}

tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = "512m"
    minHeapSize = "128m"
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}
